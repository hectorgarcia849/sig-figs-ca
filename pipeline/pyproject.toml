[project]
name = "public_spend_tracker_pipeline"
version = "0.1.0"
description = "Downloads and prepares Canadian government spending data."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.2.2",
    "duckdb>=2.0",
    "httpx>=0.27",
]

[project.scripts]
# "uv run pst <subcommand>": see public_spend_tracker_pipeline/cli.py
pst = "public_spend_tracker_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
